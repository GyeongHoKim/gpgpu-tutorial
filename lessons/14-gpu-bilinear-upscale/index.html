<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>14. GPU Bilinear Upscale</title>
    <style>
      /* figcaption 세부 스타일은 light DOM 쪽에서 준다 (split-view 의 shadow 가 못 건드리므로). */
      figure figcaption { color: #9ca3af; }
      /* 입력은 작게(128) 만들지만, 출력(256)과 비교하기 쉽게 화면에서는 같은 크기로 늘려 본다. */
      #src { width: 256px; height: 256px; image-rendering: pixelated; }
    </style>
  </head>
  <body style="margin: 0; background: #0b0f1a">
    <lesson-shell title="14. GPU Bilinear Upscale">
      <span slot="desc">
        작은 입력 텍스처(128×128)를 compute shader 로 2x bilinear 확대(256×256)하고,
        CPU 의 bilinearUpscale 결과와 숫자로 비교합니다.
      </span>

      <split-view slot="stage">
        <figure>
          <figcaption>입력 (128×128, 화면에선 확대해 표시)</figcaption>
          <canvas id="src" width="128" height="128"></canvas>
        </figure>
        <figure>
          <figcaption>GPU 출력 (256×256)</figcaption>
          <canvas id="gpu" width="256" height="256"></canvas>
        </figure>
      </split-view>

      <div slot="controls">
        <label style="color: #e5e7eb; font: 13px system-ui, sans-serif">
          모드:
          <select id="mode">
            <option value="bilinear">bilinear (선형 보간)</option>
            <option value="nearest">nearest (최근접 복제)</option>
          </select>
        </label>
        <stats-panel id="stats"></stats-panel>
      </div>
    </lesson-shell>

    <!-- 실습용 골격. 완성본은 solution/main.ts 와 비교하세요. -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
