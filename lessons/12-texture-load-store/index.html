<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>12. WGSL에서 Texture 읽고 쓰기</title>
    <style>
      /* figcaption 세부 스타일은 light DOM 쪽에서 준다 (split-view 의 shadow 가 못 건드리므로). */
      figure figcaption { color: #9ca3af; }
    </style>
  </head>
  <body style="margin: 0; background: #0b0f1a">
    <lesson-shell title="12. WGSL에서 Texture 읽고 쓰기">
      <span slot="desc">
        textureLoad 로 입력 텍스처를 읽고, textureStore 로 출력 텍스처에 써서 R↔B 채널을 스왑합니다. CPU 결과와 숫자로 비교합니다.
      </span>

      <split-view slot="stage">
        <figure>
          <figcaption>입력</figcaption>
          <canvas id="src" width="256" height="256"></canvas>
        </figure>
        <figure>
          <figcaption>GPU 출력 (R↔B 스왑)</figcaption>
          <canvas id="gpu" width="256" height="256"></canvas>
        </figure>
      </split-view>

      <stats-panel id="stats" slot="controls"></stats-panel>
    </lesson-shell>

    <!-- 실습용 골격. 완성본은 solution/main.ts 와 비교하세요. -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
