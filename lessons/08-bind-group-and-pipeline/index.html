<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>8. Bind Group과 Pipeline</title>
    <style>
      /* figcaption 세부 스타일은 light DOM 쪽에서 준다 (split-view 의 shadow 가 못 건드리므로). */
      figure figcaption { color: #9ca3af; }
    </style>
  </head>
  <body style="margin: 0; background: #0b0f1a">
    <lesson-shell title="8. Bind Group과 Pipeline">
      <span slot="desc">
        가장 단순한 compute pipeline(입력 텍스처를 그대로 복사)을 만들면서
        bind group · pipeline · dispatch 의 와이어링을 직접 봅니다.
        오른쪽 출력이 왼쪽 입력과 똑같이 보이면 성공입니다.
      </span>

      <split-view slot="stage">
        <figure>
          <figcaption>입력</figcaption>
          <canvas id="src" width="256" height="256"></canvas>
        </figure>
        <figure>
          <figcaption>GPU 출력 (복사)</figcaption>
          <canvas id="gpu" width="256" height="256"></canvas>
        </figure>
      </split-view>

      <stats-panel id="stats" slot="controls"></stats-panel>
    </lesson-shell>

    <!-- 실습용 골격. 완성본은 solution/main.ts 와 비교하세요. -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
