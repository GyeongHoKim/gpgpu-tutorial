<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>15. GPU Convolution Filter</title>
    <style>
      /* figcaption 세부 스타일은 light DOM 쪽에서 준다 (split-view 의 shadow 가 못 건드리므로). */
      figure figcaption { color: #9ca3af; }
      /* kernel 선택 UI (controls slot) */
      .kernel-controls { display: flex; gap: 8px; align-items: center;
                         color: #e5e7eb; font: 13px system-ui, sans-serif; }
      .kernel-controls select { background: #111827; color: #e5e7eb;
                                border: 1px solid #1f2937; border-radius: 6px;
                                padding: 6px 10px; font: 13px system-ui, sans-serif; }
    </style>
  </head>
  <body style="margin: 0; background: #0b0f1a">
    <lesson-shell title="15. GPU Convolution Filter">
      <span slot="desc">
        compute shader 로 3x3 convolution(blur / sharpen / edge)을 적용하고, 5장 CPU 결과와 숫자로 비교합니다.
      </span>

      <split-view slot="stage">
        <figure>
          <figcaption>입력</figcaption>
          <canvas id="src" width="256" height="256"></canvas>
        </figure>
        <figure>
          <figcaption>GPU convolution 결과</figcaption>
          <canvas id="gpu" width="256" height="256"></canvas>
        </figure>
      </split-view>

      <div class="kernel-controls" slot="controls">
        <label for="kernel">kernel</label>
        <select id="kernel">
          <option value="identity">identity (그대로)</option>
          <option value="blur" selected>blur (흐리게)</option>
          <option value="sharpen">sharpen (선명하게)</option>
          <option value="edge">edge (경계 검출)</option>
        </select>
      </div>

      <stats-panel id="stats" slot="controls"></stats-panel>
    </lesson-shell>

    <!-- 실습용 골격. 완성본은 solution/main.ts 와 비교하세요. -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
